name: Deploy MERN Task Manager to EC2 Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: mern-stack-task-manageme
  ECR_REGISTRY: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  IMAGE_TAG: ${{ github.sha }}
  INSTANCE_ID: i-019e6110cdb66b34e
  PUBLIC_URL: http://15.207.190.237
  CONTAINER_PORT: "4000"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build client (Vite)
        working-directory: client
        run: |
          npm ci || npm install
          npm run build

      - name: Install server dependencies (diagnostic)
        working-directory: server
        run: |
          npm ci || npm install

      - name: Configure AWS credentials
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"
          aws sts get-caller-identity

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:$IMAGE_TAG" -t "$FULL_IMAGE:latest" .
          docker image ls

      - name: Push Docker image to ECR
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

      - name: Deploy to EC2 via SSM
        run: |
          export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"

          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app $IMAGE_URI"
            ]
          }
          SSMPARAMS

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy MERN task manager app" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --region "$AWS_REGION"

          aws ssm get-command-invocation \
            --instance-id "$INSTANCE_ID" \
            --command-id "$COMMAND_ID" \
            --region "$AWS_REGION" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" \
            --output text

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE from $PUBLIC_URL"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after retries."
          exit 1