name: build-deploy-verify-mern-task-manager

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  ECR_REGISTRY_HOST: 759204735992.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY_URI: 759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-stack-task-manageme
  INSTANCE_ID: i-082e26fae07cce454
  SECRETS_MANAGER_ID: deptic/MERN_STACK_TASK_MANAGEMENT_APPLICATION/secrets
  CONTAINER_PORT: "80"
  NODE_BACKEND_PORT: "4000"
  PUBLIC_URL: http://13.205.89.68

jobs:
  build-push-deploy-verify:
    name: Build, Push, Deploy (EC2 Docker), Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for client build diagnostics
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        working-directory: client
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Client lint diagnostics (eslint)
        working-directory: client
        run: npm run lint || echo "::warning::eslint reported issues; continuing with build diagnostics"

      - name: Client build diagnostics (vite build)
        working-directory: client
        run: npm run build

      - name: Verify client dist artifacts
        working-directory: client
        run: |
          echo "--- client dist listing ---"
          ls -R dist | head -n 50
          test -f dist/index.html && echo "client dist/index.html OK"

      - name: Server syntax diagnostics (ESM parse check)
        working-directory: server
        run: |
          for f in server.js app.js routes/userRouter.js routes/taskRouter.js models/userSchema.js models/taskSchema.js; do
            if [ -f "$f" ]; then node --check "$f" && echo "syntax OK: $f"; fi
          done

      - name: Repository layout diagnostics
        run: |
          echo "--- repo root ---"
          ls -la
          echo "--- server directory ---"
          ls -la server || true
          echo "--- dockerfile probe ---"
          ls -la Dockerfile dockerfile server/Dockerfile 2>/dev/null || echo "no Dockerfile found in repository"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to AWS (static credentials)
        run: |
          aws sts get-caller-identity --region "$AWS_REGION"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY_HOST"

      - name: Compute image tags
        id: image
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          FULL_IMAGE="$ECR_REPOSITORY_URI:$SHORT_SHA"
          LATEST_IMAGE="$ECR_REPOSITORY_URI:latest"
          echo "FULL_IMAGE=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
          echo "LATEST_IMAGE=$LATEST_IMAGE" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (context = repository root, nginx :80 -> node :4000)
        run: |
          docker build \
            -t "${{ steps.image.outputs.FULL_IMAGE }}" \
            -t "${{ steps.image.outputs.LATEST_IMAGE }}" \
            -f Dockerfile .

      - name: Push Docker image to Amazon ECR
        run: |
          docker push "${{ steps.image.outputs.FULL_IMAGE }}"
          docker push "${{ steps.image.outputs.LATEST_IMAGE }}"

      - name: Deploy to EC2 instance via SSM send-command
        run: |
          cat > /tmp/ssm-params.json << 'SSMPARAMS'
          {
            "commands": [
              "set -e",
              "export AWS_REGION=ap-south-1",
              "export ECR_REGISTRY=759204735992.dkr.ecr.ap-south-1.amazonaws.com",
              "export IMAGE_URI=759204735992.dkr.ecr.ap-south-1.amazonaws.com/mern-stack-task-manageme:latest",
              "export SECRETS_MANAGER_ID=deptic/MERN_STACK_TASK_MANAGEMENT_APPLICATION/secrets",
              "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY",
              "docker pull $IMAGE_URI",
              "SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id $SECRETS_MANAGER_ID --region $AWS_REGION --query SecretString --output text)",
              "MONGO_URI=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"MONGO_URI\",\"\"))')",
              "JWT_SECRET_KEY=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"JWT_SECRET_KEY\",\"\"))')",
              "CLOUDINARY_CLIENT_NAME=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"CLOUDINARY_CLIENT_NAME\",\"\"))')",
              "CLOUDINARY_CLIENT_API=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"CLOUDINARY_CLIENT_API\",\"\"))')",
              "CLOUDINARY_CLIENT_SECRET=$(echo \"$SECRET_JSON\" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get(\"CLOUDINARY_CLIENT_SECRET\",\"\"))')",
              "docker stop app || true",
              "docker rm app || true",
              "docker run -d --restart always -p 80:80 --name app -e NODE_ENV=production -e PORT=4000 -e COOKIE_EXPIRE=5 -e JWT_EXPIRES=5d -e FRONTEND_URL=http://13.205.89.68 -e MONGO_URI=\"$MONGO_URI\" -e JWT_SECRET_KEY=\"$JWT_SECRET_KEY\" -e CLOUDINARY_CLIENT_NAME=\"$CLOUDINARY_CLIENT_NAME\" -e CLOUDINARY_CLIENT_API=\"$CLOUDINARY_CLIENT_API\" -e CLOUDINARY_CLIENT_SECRET=\"$CLOUDINARY_CLIENT_SECRET\" $IMAGE_URI",
              "for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:80/ && echo 'container healthy' && break; sleep 2; done"
            ]
          }
          SSMPARAMS
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --region "$AWS_REGION" --document-name "AWS-RunShellScript" --parameters file:///tmp/ssm-params.json --query "Command.CommandId" --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
          echo "Dispatched SSM command: $COMMAND_ID"

      - name: Wait for SSM command completion
        run: |
          while true; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --region "$AWS_REGION" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              InProgress|Pending|Delayed) sleep 5 ;;
              *) echo "SSM command failed with status: $STATUS"; exit 1 ;;
            esac
          done

      - name: Verify deployment health (HTTP 200 required)
        run: |
          echo "Waiting for application to serve traffic at $PUBLIC_URL ..."
          sleep 10
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/" || true)
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed: HTTP 200 from $PUBLIC_URL/"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: never received HTTP 200 from $PUBLIC_URL/"
          exit 1

      - name: Verify API route reachability through nginx proxy
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL/api/v1/user/me" || true)
          echo "API probe /api/v1/user/me returned HTTP $HTTP_CODE (nginx->node:4000 proxy reachable)"
          if [ "$HTTP_CODE" = "000" ] || [ "$HTTP_CODE" = "502" ] || [ "$HTTP_CODE" = "504" ]; then
            echo "API proxy unreachable; failing verification"
            exit 1
          fi
          echo "API proxy verification passed"

      - name: Deployment summary
        run: |
          echo "Deployment complete."
          echo "Image: ${{ steps.image.outputs.FULL_IMAGE }} (and :latest)"
          echo "Instance: $INSTANCE_ID"
          echo "Public URL: $PUBLIC_URL"